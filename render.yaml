services:
  - type: web
    name: atme-co-po-peo-mapping
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FLASK_SECRET_KEY
        generateValue: true
      # Optional: connect a Render PostgreSQL database so user accounts survive redeploys
      # - key: DATABASE_URL
      #   fromDatabase: { name: atme-db, property: connectionString }
