<!DOCTYPE html>
<html lang="en"><head><script>document.documentElement.setAttribute('data-theme','dark')</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset password | ATME AI CO-PO-PEO Mapping</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static',filename='css/creative.css') }}">
<link rel="stylesheet" href="{{ url_for('static',filename='css/creative-light.css') }}">
<link rel="stylesheet" href="{{ url_for('static',filename='css/creative-dark.css') }}">
</head>
<body class="auth-page"><div class="auth-shell">
<section class="auth-brand" data-constellation>
<span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
<img class="logo" src="{{ url_for('static',filename='images/ATME.jpeg') }}" alt="ATME College of Engineering">
<h1>Locked out?<br>Set a new password</h1><p>Enter your username and choose a new password. You can log in straight away.</p><div class="feature-list"></div></section>
<section class="auth-card"><h2>Reset password</h2><p class="auth-subtitle">Enter your username and a new password.</p>
{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
{% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}
<form action="/forgot" method="POST">
<div class="form-group"><label for="u">Username</label><div class="input-icon"><i class="fa-solid fa-user"></i><input class="form-control" id="u" type="text" name="username" placeholder="Enter your username" required></div></div>
<div class="form-group"><label for="p">New password</label><div class="pw-wrap input-icon"><i class="fa-solid fa-lock"></i><input class="form-control" id="p" type="password" name="new_password" placeholder="Enter a new password" required><button type="button" onclick="tp(this)">Show</button></div></div>
<button class="primary-btn" type="submit">Reset password</button></form>
<p class="auth-link"><a href="/">Back to login</a></p></section></div><script>function tp(b){var i=b.previousElementSibling;var s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Hide':'Show';}</script><script src="{{ url_for('static',filename='js/creative.js') }}"></script>
</body></html>
