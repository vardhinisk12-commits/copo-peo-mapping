<!DOCTYPE html>
<html lang="en"><head><script>document.documentElement.setAttribute('data-theme','dark')</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Upload Dataset | ATME AI CO-PO-PEO Mapping</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static',filename='css/creative.css') }}">
<link rel="stylesheet" href="{{ url_for('static',filename='css/creative-light.css') }}">
<link rel="stylesheet" href="{{ url_for('static',filename='css/creative-dark.css') }}">
</head><body>
<div class="dept-page">
<div class="dept-top"><div><img src="{{ url_for('static', filename='images/ATME.jpeg') }}" alt="ATME"><h1>AI-Based CO–PO–PEO Mapping System<br><small>Upload dataset</small></h1><a class="out" href="/dashboard"><i class="fa-solid fa-arrow-left"></i> Dashboard</a></div></div>
<div class="upload-hero"><div class="ico"><i class="fa-solid fa-cloud-arrow-up"></i></div><h1>Upload Excel files</h1><p>Drop each file onto its card or tap to browse. Supported: .xlsx, .xls, .csv</p></div>
<div class="card2"><form method="POST" enctype="multipart/form-data" id="upForm">
<div class="drop-grid">
<label class="drop"><i class="fa-solid fa-book"></i><b>Subjects</b><small>Click or drop a file</small><input type="file" name="subjects" accept=".xlsx,.xls,.csv"></label>
<label class="drop"><i class="fa-solid fa-bullseye"></i><b>Course Outcomes (CO)</b><small>Click or drop a file</small><input type="file" name="co" accept=".xlsx,.xls,.csv"></label>
<label class="drop"><i class="fa-solid fa-award"></i><b>Program Outcomes (PO)</b><small>Click or drop a file</small><input type="file" name="po" accept=".xlsx,.xls,.csv"></label>
<label class="drop"><i class="fa-solid fa-crosshairs"></i><b>Program Specific Outcomes (PSO)</b><small>Click or drop a file</small><input type="file" name="pso" accept=".xlsx,.xls,.csv"></label>
<label class="drop wide"><i class="fa-solid fa-graduation-cap"></i><b>Program Educational Objectives (PEO)</b><small>Click or drop a file</small><input type="file" name="peo" accept=".xlsx,.xls,.csv"></label>
</div>
<button class="go" type="submit" style="margin-top:24px;width:100%"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate Mapping</button>
</form></div></div>
<div id="busy"><div class="box"><div class="spin"></div><b>Generating mappings...</b><br><small style="color:var(--muted)">Running the AI model. Please keep this page open.</small></div></div>
<script>
document.querySelectorAll('.drop').forEach(function(d){var i=d.querySelector('input'),t=d.querySelector('small');
 i.addEventListener('change',function(){if(i.files.length){d.classList.add('has');t.textContent=i.files[0].name;d.querySelector('i').className='fa-solid fa-circle-check';}});
 ['dragenter','dragover'].forEach(function(e){d.addEventListener(e,function(){d.classList.add('over')})});
 ['dragleave','drop'].forEach(function(e){d.addEventListener(e,function(){d.classList.remove('over')})});});
document.getElementById('upForm').addEventListener('submit',function(){document.getElementById('busy').style.display='flex';});
</script><script src="{{ url_for('static',filename='js/script.js') }}"></script><script src="{{ url_for('static',filename='js/creative.js') }}"></script>
</body></html>
