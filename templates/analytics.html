<!DOCTYPE html>

<html>

<head>


<title>
Subject Mapping Analytics
</title>


<link rel="stylesheet"
href="{{ url_for('static',filename='css/style.css') }}">


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>



<body>



<div class="main-content">



<div class="box">


<h1>
Subject Mapping Analytics
</h1>



<div class="chart-box">


<canvas id="mappingChart"></canvas>


</div>


</div>


</div>





<script>


const labels = {{labels|tojson}};

const values = {{values|tojson}};



new Chart(

document.getElementById("mappingChart"),


{


type:"bar",


data:{


labels:labels,


datasets:[{


label:"Mapping Strength (0-3)",

data:values,


borderWidth:1


}]


},



options:{


responsive:true,


scales:{


y:{


beginAtZero:true,

max:3


}


}



}



}


);


</script>


</body>


</html>
